name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - "*"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        environment: [test-py310, test-py311, test-py312, test-py313, test-py314]
        include:
          - os: macos-latest
            environment: test-py314
          - os: windows-latest
            environment: test-py314

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: prefix-dev/setup-pixi@v0.9.2
        with:
          pixi-version: v0.63.2
          environments: ${{ matrix.environment }}
          frozen: true

      - name: run tests suite
        run: pixi run -e ${{ matrix.environment }} test

      - name: upload coverage reports to Codecov
        # upload coverage from one job only
        if: matrix.os == 'ubuntu-latest' && matrix.environment == 'test-py314'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: martibosch/pylandstats

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: prefix-dev/setup-pixi@v0.9.2
        with:
          pixi-version: v0.63.2
          environments: dev
          frozen: true

      - name: build sdist and check it # the `check` task depends on `build-sdist`
        run: pixi run -e dev check

  # the user guide notebooks are executed here (rather than only when building the docs
  # on read the docs) so that a failure is reported next to the test results, with the
  # traceback inline. Note that the FRAGSTATS comparison notebook asserts that the
  # computed metrics match the FRAGSTATS reference files, i.e., this also acts as the
  # metrics correctness check
  notebooks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: prefix-dev/setup-pixi@v0.9.2
        with:
          pixi-version: v0.63.2
          environments: user-guide
          frozen: true

      - name: run the user guide notebooks
        run: pixi run -e user-guide run-notebooks
