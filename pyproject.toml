[build-system]
requires = ["setuptools>=74.1.0", "wheel", "cython>=3.1", "numpy>=2.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pylandstats"
version = "3.1.0"
description = "Computing landscape metrics in the Python ecosystem."
readme = "README.md"
authors = [
  {name = "Martí Bosch", email = "marti.bosch@epfl.ch"}
]
license = {text = "GPL-3.0"}
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]
requires-python = ">=3.10"
dependencies = [
  "clustergram",
  "dask",
  "geopandas",
  "matplotlib >= 2.2",
  "numpy >= 1.15",
  "pandas >= 0.23",
  "rasterio >= 1.0.0",
  "seaborn",
  "scikit-learn >= 1.0.0",
  "scipy >= 1.0.0"
]

[project.optional-dependencies]
test = ["coverage[toml]", "pytest", "pytest-cov", "ruff"]
dev = ["build", "commitizen", "pre-commit", "pip", "toml", "twine"]
doc = ["myst-nb", "pydata-sphinx-theme", "sphinx", "sphinxemoji"]
# dependencies of the user guide notebooks, which are not required to *render*
# the docs but only to *execute* them
user-guide = ["contextily", "ipykernel", "nbclient", "swisslandstats-geopy"]

[project.urls]
Repository = "https://github.com/martibosch/pylandstats"

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
skip = "*-musllinux_i686"

[tool.codespell]
ignore-words-list = "te"
skip = "CHANGELOG.md,pixi.lock"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "pep621"
version_files = [
  "src/pylandstats/__init__.py",
  "pyproject.toml:version"
]

[tool.coverage.report]
exclude_lines = [
  "if self.debug:",
  "pragma: no cover",
  "raise NotImplementedError",
  "except ModuleNotFoundError",
  "except ImportError"
]
ignore_errors = true
omit = ["tests/*", "docs/conf.py"]

[tool.pixi.dependencies]
python = ">=3.10,<3.15"
# the geospatial stack comes from conda-forge rather than from the PyPI wheels,
# which vendor their own gdal and would thus conflict with the conda-forge one
gdal = ">=3.3"
geopandas = "*"
rasterio = ">=1.0.0"
# ACHTUNG: the toolchain below is required in *every* environment (not only in
# `dev`) because the editable install of pylandstats is part of the default
# feature and is built with `no-build-isolation` (see `tool.pixi.pypi-options`)
cython = ">=3.1"
numpy = ">=2.0.0"
setuptools = ">=74.1.0"
# so that the default environment can be used as a jupyter kernel, which is
# what pixi-kernel falls back to
ipykernel = ">=7.3.0,<8"

[tool.pixi.environments]
default = {solve-group = "default"}
dev = {features = ["dev"], solve-group = "default"}
doc = {features = ["doc", "user-guide"], solve-group = "default"}
test = {features = ["test"], solve-group = "default"}
user-guide = {features = ["user-guide"], solve-group = "default"}
# ACHTUNG: `no-default-feature` so that this environment is only R, i.e., it neither
# installs python nor builds the cython extension of pylandstats
benchmark = {features = ["benchmark"], no-default-feature = true}
# one environment per supported python version, to match the wheels built by
# cibuildwheel - each needs its own solve group
test-py310 = {features = ["py310", "test"], solve-group = "py310"}
test-py311 = {features = ["py311", "test"], solve-group = "py311"}
test-py312 = {features = ["py312", "test"], solve-group = "py312"}
test-py313 = {features = ["py313", "test"], solve-group = "py313"}
test-py314 = {features = ["py314", "test"], solve-group = "py314"}

[tool.pixi.feature.benchmark]
# ACHTUNG: r-landscapemetrics >=2 is not built for every platform of the workspace
# (e.g., osx-arm64), and the benchmarks are anyway measured manually in a single machine
platforms = ["linux-64"]

[tool.pixi.feature.benchmark.dependencies]
# R and landscapemetrics, to measure the execution times reported in the performance
# notes annex of the user guide. ACHTUNG: this environment is NOT used to build the docs
# nor to run the notebooks, it is only used to (manually) re-measure the benchmarks
r-base = "*"
r-landscapemetrics = ">=2"
r-terra = "*"

[tool.pixi.feature.benchmark.tasks]
benchmark-landscapemetrics = "Rscript docs/user-guide/metrics-benchmark.R"

[tool.pixi.feature.dev.tasks]
# editable installs do not recompile the cython extension when `.pyx` files
# change, so rebuild it in place explicitly
build-ext = "python setup.py build_ext --inplace"
build-sdist = "python -m build --sdist"
check = {cmd = "twine check --strict dist/*", depends-on = ["build-sdist"]}

[tool.pixi.feature.doc.tasks]
build-doc = "sphinx-build docs docs/_build"

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.test.tasks]
test = "pytest -s --cov=pylandstats --cov-report=xml tests"

[tool.pixi.feature.user-guide.tasks]
# execute the user guide notebooks (without storing their outputs, which are computed
# when building the docs), i.e., so that they are also tested in github actions.
# ACHTUNG: the notebooks are listed explicitly (rather than globbed) because the annexes
# from a02 on are not executed - keep in sync with `nb_execution_excludepatterns` in
# docs/conf.py
run-notebooks = """jupyter execute --kernel_name=python3
  docs/user-guide/overview.ipynb
  docs/user-guide/landscape-analysis.ipynb
  docs/user-guide/spatiotemporal-analysis.ipynb
  docs/user-guide/zonal-analysis.ipynb
  docs/user-guide/spatiotemporal-zonal-analysis.ipynb
  docs/user-guide/spatial-signature-analysis.ipynb
  docs/user-guide/a01-fragstats-comparison.ipynb"""

[tool.pixi.pypi-dependencies]
pylandstats = {path = ".", editable = true}

[tool.pixi.pypi-options]
# build the extension against the conda-forge numpy/cython/compiler rather than
# against an ephemeral build environment resolved from PyPI
no-build-isolation = ["pylandstats"]

# on unix, the cython extension is built with the conda-forge compiler; on
# windows there is no conda compiler, so setuptools autodetects the (system) MSVC
# toolchain via vswhere - installing `vs2022_win-64` (via `c-compiler`) would set
# `DISTUTILS_USE_SDK` and thus expect an already-activated toolchain, which is not
# the case when `no-build-isolation` builds the editable install during `pixi
# install` (before the environment activation scripts run)
[tool.pixi.target.linux-64.dependencies]
c-compiler = "*"

[tool.pixi.target.linux-aarch64.dependencies]
c-compiler = "*"

[tool.pixi.target.osx-64.dependencies]
c-compiler = "*"

[tool.pixi.target.osx-arm64.dependencies]
c-compiler = "*"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["D", "E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["pylandstats"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F403"]
"src/pylandstats/landscape.py" = ["D401"] # for metric docstrings
"tests/test_pylandstats.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.setuptools.packages.find]
where = ["src"]
