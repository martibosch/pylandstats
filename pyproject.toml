[build-system]
requires = ["setuptools>=74.1.0", "wheel", "cython>=3.1", "numpy>=2.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pylandstats"
version = "3.1.0"
description = "Computing landscape metrics in the Python ecosystem."
readme = "README.md"
authors = [
  {name = "Martí Bosch", email = "marti.bosch@epfl.ch"}
]
license = {text = "GPL-3.0"}
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]
requires-python = ">=3.10"
dependencies = [
  "clustergram",
  "dask",
  "geopandas",
  "matplotlib >= 2.2",
  "numpy >= 1.15",
  "pandas >= 0.23",
  "rasterio >= 1.0.0",
  "seaborn",
  "scikit-learn >= 1.0.0",
  "scipy >= 1.0.0"
]

[project.optional-dependencies]
test = ["coverage[toml]", "pytest", "pytest-cov", "ruff"]
dev = ["build", "commitizen", "pre-commit", "pip", "toml", "twine"]
doc = ["m2r2", "myst-nb", "pydata-sphinx-theme", "sphinx"]
# dependencies of the user guide notebooks, which are not required to *render*
# the docs but only to *execute* them
user-guide = ["contextily", "ipykernel", "nbclient", "osmnx", "swisslandstats-geopy"]

[project.urls]
Repository = "https://github.com/martibosch/pylandstats"

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
skip = "*-musllinux_i686"

[tool.codespell]
ignore-words-list = "te"
skip = "CHANGELOG.md,pixi.lock"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "pep621"
version_files = [
  "src/pylandstats/__init__.py",
  "pyproject.toml:version"
]

[tool.coverage.report]
exclude_lines = [
  "if self.debug:",
  "pragma: no cover",
  "raise NotImplementedError",
  "except ModuleNotFoundError",
  "except ImportError"
]
ignore_errors = true
omit = ["tests/*", "docs/conf.py"]

[tool.pixi.dependencies]
python = ">=3.10,<3.15"
# the geospatial stack comes from conda-forge rather than from the PyPI wheels,
# which vendor their own gdal and would thus conflict with the conda-forge one
gdal = ">=3.3"
geopandas = "*"
rasterio = ">=1.0.0"
# ACHTUNG: the toolchain below is required in *every* environment (not only in
# `dev`) because the editable install of pylandstats is part of the default
# feature and is built with `no-build-isolation` (see `tool.pixi.pypi-options`)
c-compiler = "*"
cython = ">=3.1"
numpy = ">=2.0.0"
setuptools = ">=74.1.0"
# so that the default environment can be used as a jupyter kernel, which is
# what pixi-kernel falls back to
ipykernel = ">=7.3.0,<8"

[tool.pixi.environments]
default = {solve-group = "default"}
dev = {features = ["dev"], solve-group = "default"}
doc = {features = ["doc", "user-guide"], solve-group = "default"}
test = {features = ["test"], solve-group = "default"}
user-guide = {features = ["user-guide"], solve-group = "default"}
# one environment per supported python version, to match the wheels built by
# cibuildwheel - each needs its own solve group
test-py310 = {features = ["py310", "test"], solve-group = "py310"}
test-py311 = {features = ["py311", "test"], solve-group = "py311"}
test-py312 = {features = ["py312", "test"], solve-group = "py312"}
test-py313 = {features = ["py313", "test"], solve-group = "py313"}
test-py314 = {features = ["py314", "test"], solve-group = "py314"}

[tool.pixi.feature.dev.tasks]
# editable installs do not recompile the cython extension when `.pyx` files
# change, so rebuild it in place explicitly
build-ext = "python setup.py build_ext --inplace"
build-sdist = "python -m build --sdist"
check = {cmd = "twine check --strict dist/*", depends-on = ["build-sdist"]}

[tool.pixi.feature.doc.tasks]
build-doc = "sphinx-build docs docs/_build"

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.test.tasks]
test = "pytest -s --cov=pylandstats --cov-report=xml tests"

[tool.pixi.pypi-dependencies]
pylandstats = {path = ".", editable = true}

[tool.pixi.pypi-options]
# build the extension against the conda-forge numpy/cython/compiler rather than
# against an ephemeral build environment resolved from PyPI
no-build-isolation = ["pylandstats"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["D", "E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["pylandstats"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F403"]
"src/pylandstats/landscape.py" = ["D401"] # for metric docstrings
"tests/test_pylandstats.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.setuptools.packages.find]
where = ["src"]
